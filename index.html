<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi GitHub + Google Sheets</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 500px; margin: 30px auto; padding: 0 20px; }
    form { display: flex; flex-direction: column; gap: 10px; margin-bottom: 30px; }
    input, textarea, button { padding: 10px; font-size: 14px; }
    button { background-color: #0366d6; color: white; border: none; cursor: pointer; border-radius: 4px; }
    button:hover { background-color: #024ea4; }
    .item { background: #f6f8fa; padding: 10px; margin-bottom: 10px; border-radius: 4px; border: 1px solid #e1e4e8; }
  </style>
</head>
<body>

  <h2>Kirim Data ke Google Sheets</h2>
  <form id="dataForm">
    <input type="text" id="nama" placeholder="Nama Anda" required>
    <textarea id="pesan" placeholder="Tulis pesan..." required></textarea>
    <button type="submit">Kirim Data</button>
  </form>

  <h2>Data Terformat</h2>
  <div id="dataList">Loading data...</div>

  <script>
    // GANTI URL DI BAWAH INI DENGAN WEB APP URL DARI GOOGLE APPS SCRIPT
    const API_URL = "https://script.google.com/macros/s/AKfycbxcjecbQvArwX68F7Y6jWvA_b6xedgcHEPlXoked0q3ZOSm71ddH_52goBfJy_1A5BasA/exec";

    // Fungsi Mengirim Data (POST)
    document.getElementById('dataForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const nama = document.getElementById('nama').value;
      const pesan = document.getElementById('pesan').value;

      try {
        await fetch(API_URL, {
          method: 'POST',
          mode: 'no-cors', // Diperlukan untuk Google Apps Script
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nama, pesan })
        });

        alert("Data terkirim!");
        document.getElementById('dataForm').reset();
        loadData(); // Reload data setelah kirim
      } catch (err) {
        alert("Gagal mengirim data");
      }
    });

    // Fungsi Mengambil Data (GET)
    async function loadData() {
      try {
        const response = await fetch(API_URL);
        const data = await response.json();
        const container = document.getElementById('dataList');
        
        container.innerHTML = '';
        if (data.length === 0) {
          container.innerHTML = '<p>Belum ada data.</p>';
          return;
        }

        data.forEach(item => {
          const div = document.createElement('div');
          div.className = 'item';
          div.innerHTML = `<strong>${item.nama}</strong><p>${item.pesan}</p>`;
          container.appendChild(div);
        });
      } catch (err) {
        document.getElementById('dataList').innerText = "Gagal memuat data.";
      }
    }

    // Panggil data saat halaman dimuat
    loadData();
  </script>
</body>
</html>
