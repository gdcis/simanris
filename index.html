<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Aplikasi Terproteksi</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 500px; margin: 30px auto; padding: 0 20px; }
    .hidden { display: none; }
    form { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
    input, textarea, button { padding: 10px; font-size: 14px; }
    button { background-color: #0366d6; color: white; border: none; cursor: pointer; }
    .item { background: #f6f8fa; padding: 10px; margin-bottom: 10px; border: 1px solid #ddd; }
  </style>
</head>
<body>

  <!-- TAMPILAN 1: FORM LOGIN -->
  <div id="loginSection">
    <h2>Login Akses</h2>
    <p>Masukkan email terdaftar Anda untuk melanjutkan:</p>
    <input type="email" id="loginEmail" placeholder="nama@email.com" required>
    <button onclick="login()">Masuk</button>
    <p id="loginStatus" style="color:red;"></p>
  </div>

  <!-- TAMPILAN 2: APLIKASI UTAMA (Di-hide secara bawaan) -->
  <div id="appSection" class="hidden">
    <h2>Kirim Data</h2>
    <form id="dataForm">
      <input type="text" id="nama" placeholder="Nama Anda" required>
      <textarea id="pesan" placeholder="Tulis pesan..." required></textarea>
      <button type="submit">Kirim Data</button>
    </form>

    <h2>Data Terformat</h2>
    <div id="dataList">Loading data...</div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxcjecbQvArwX68F7Y6jWvA_b6xedgcHEPlXoked0q3ZOSm71ddH_52goBfJy_1A5BasA/exec";
    let currentUserEmail = "";

    // Fungsi Verifikasi Email saat Login
    async function login() {
      const email = document.getElementById('loginEmail').value;
      const status = document.getElementById('loginStatus');
      
      if(!email) return alert("Isi email terlebih dahulu!");
      status.innerText = "Checking email...";

      try {
        const res = await fetch(`${API_URL}?action=checkEmail&email=${encodeURIComponent(email)}`);
        const data = await res.json();

        if (data.allowed) {
          currentUserEmail = email;
          document.getElementById('loginSection').classList.add('hidden');
          document.getElementById('appSection').classList.remove('hidden');
          loadData();
        } else {
          status.innerText = "Akses Ditolak! Email Anda tidak terdaftar.";
        }
      } catch (err) {
        status.innerText = "Gagal memverifikasi email.";
      }
    }

    // Fungsi Kirim Data
    document.getElementById('dataForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const nama = document.getElementById('nama').value;
      const pesan = document.getElementById('pesan').value;

      try {
        await fetch(API_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nama, pesan, email: currentUserEmail })
        });

        alert("Data berhasil dikirim!");
        document.getElementById('dataForm').reset();
        loadData();
      } catch (err) {
        alert("Gagal mengirim data");
      }
    });

    // Fungsi Ambil Data
    async function loadData() {
      const res = await fetch(API_URL);
      const data = await res.json();
      const container = document.getElementById('dataList');
      container.innerHTML = '';
      
      data.forEach(item => {
        container.innerHTML += `<div class="item"><strong>${item.nama}</strong><p>${item.pesan}</p></div>`;
      });
    }
  </script>
</body>
</html>
